<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#102c2b" />
<title>织网纸牌 · Spider Solitaire</title>
<style>
:root {
  --bg: #091a1a;
  --felt: #123c39;
  --felt2: #0d302e;
  --line: rgba(224, 240, 224, .13);
  --ink: #eaf3ea;
  --muted: #9cb7ad;
  --accent: #e4b46a;
  --accent2: #9ed0b6;
  --red: #be5959;
  --card-w: 86px;
  --card-h: 120px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
body { overflow-x: hidden; }
button, select { font: inherit; }
button { color: inherit; }
.app { min-height: 100vh; background: radial-gradient(circle at 12% 0%, rgba(158,208,182,.11), transparent 30rem), radial-gradient(circle at 90% 18%, rgba(228,180,106,.10), transparent 28rem), linear-gradient(145deg, #081717, #12302e 55%, #0b2020); }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:18px clamp(16px, 4vw, 48px); border-bottom: 1px solid var(--line); background: rgba(6, 20, 20, .6); backdrop-filter: blur(14px); position: sticky; top:0; z-index: 10; }
.brand { display:flex; align-items:center; gap:12px; }
.brand-mark { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:#102c2b; font-size:23px; background: linear-gradient(145deg, #f4d28e, #c58a48); box-shadow: 0 8px 22px rgba(0,0,0,.25); transform: rotate(-7deg); }
.brand h1 { font-size: 17px; letter-spacing: .12em; margin:0; font-weight: 750; }
.brand p { margin:2px 0 0; font-size:12px; color:var(--muted); }
.top-actions { display:flex; gap:8px; align-items:center; }
.ghost, .primary, .icon-btn { border: 1px solid var(--line); border-radius: 11px; padding: 9px 13px; background: rgba(255,255,255,.06); cursor:pointer; transition: transform .15s ease, background .15s ease, border-color .15s ease; }
.ghost:hover, .icon-btn:hover { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.25); transform:translateY(-1px); }
.primary { background: linear-gradient(145deg, #e7bf77, #b97b3f); color:#172a25; border:none; font-weight:800; box-shadow: 0 8px 22px rgba(177,117,57,.22); }
.primary:hover { transform:translateY(-1px); filter:brightness(1.06); }
.shell { width: min(1500px, 100%); margin:0 auto; padding: 24px clamp(14px, 3vw, 44px) 34px; }
.hud { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap: 16px; margin-bottom: 18px; }
.mode-tabs { display:flex; gap:8px; flex-wrap:wrap; }
.mode-tab { border:1px solid var(--line); background:rgba(255,255,255,.055); border-radius:999px; padding:8px 14px; cursor:pointer; color:var(--muted); }
.mode-tab.active { background:rgba(228,180,106,.18); border-color:rgba(228,180,106,.6); color:#ffe6b5; }
.stats { display:flex; gap:10px; flex-wrap:wrap; }
.stat { min-width:85px; padding:8px 12px; border:1px solid var(--line); border-radius:13px; background:rgba(0,0,0,.12); }
.stat small { display:block; color:var(--muted); font-size:11px; letter-spacing:.08em; }
.stat strong { font-size:17px; font-variant-numeric: tabular-nums; }
.board-wrap { border:1px solid rgba(220,255,235,.11); border-radius:22px; padding:16px; background: linear-gradient(140deg, rgba(255,255,255,.06), rgba(255,255,255,.015)); box-shadow: 0 24px 70px rgba(0,0,0,.22), inset 0 1px rgba(255,255,255,.06); overflow:auto; touch-action:pan-x; -webkit-overflow-scrolling:touch; }
.board { min-width: 880px; display:grid; grid-template-columns: repeat(10, minmax(76px, 1fr)); gap: clamp(7px, .8vw, 13px); padding-bottom: 34px; }
.column { min-height: 500px; border-radius:16px; padding:7px 4px 12px; position:relative; background:transparent; border:1px solid transparent; box-shadow:none; transition: border-color .15s ease, background .15s ease; }
.column.drop-target { border-color: transparent; background: transparent; }
.column.empty::after { content:'+'; position:absolute; inset:10px 4px auto; height:54px; border-radius:12px; border:1px dashed rgba(224,240,224,.22); display:grid; place-items:center; color:rgba(224,240,224,.28); font-size:24px; }
.card { width:100%; aspect-ratio: .715; min-height: 91px; border-radius:11px; position:relative; user-select:none; cursor:pointer; margin-bottom:-66px; transition: transform .18s ease, box-shadow .18s ease, filter .18s ease; transform-origin: center bottom; }
.card:last-child { margin-bottom:0; }
.card.face-up { background:linear-gradient(145deg, #fffdf7, #e8ece8); color:#273630; border:1px solid rgba(19,48,43,.25); box-shadow: 0 4px 10px rgba(0,0,0,.22); touch-action:none; cursor:grab; }
.card.face-up:active { cursor:grabbing; }
.card.dragging-source { opacity:.28; filter:saturate(.7); }
.drag-ghost { position:fixed; left:0; top:0; pointer-events:none; z-index:60; opacity:1; filter:drop-shadow(0 14px 18px rgba(0,0,0,.3)); transform:translate3d(0,0,0); }
.drag-ghost .card { position:absolute; left:0; width:100%; margin:0; cursor:grabbing; pointer-events:none; opacity:1 !important; filter:none; }
.drag-ghost .card-art { opacity:1; }
.drag-ghost .card:last-child { margin-bottom:0; }
.drag-count { position:absolute; right:-10px; top:-10px; min-width:24px; height:24px; padding:0 6px; display:grid; place-items:center; border-radius:99px; background:var(--accent); color:#172a25; font-size:12px; font-weight:800; box-shadow:0 4px 10px rgba(0,0,0,.28); }
.card.face-up:hover { transform:translateY(-3px); box-shadow:0 8px 16px rgba(0,0,0,.28); z-index:3; }
.card.face-down { background:linear-gradient(135deg, #234e4a, #102e2d); border:1px solid rgba(210,240,220,.22); box-shadow: 0 5px 10px rgba(0,0,0,.18); cursor:default; }
.card.face-down::before { content:''; position:absolute; inset:6px; border:1px solid rgba(228,180,106,.44); border-radius:7px; background: repeating-linear-gradient(45deg, rgba(228,180,106,.08) 0 2px, transparent 2px 6px); }
.card.selected { transform: translateY(-8px); box-shadow:0 7px 14px rgba(0,0,0,.28); z-index:4; }
.card.hint { animation: pulse 1s ease-in-out 2; box-shadow:0 0 0 2px var(--accent2), 0 0 22px rgba(158,208,182,.55); z-index:5; }
@keyframes pulse { 50% { transform:translateY(-8px) scale(1.025); } }
@keyframes dealIn { from { opacity:0; transform:translateY(-12px) scale(.97); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes stockHint { 0%,100% { transform:translateY(0) scale(1); box-shadow:1px 2px 0 rgba(0,0,0,.5), 0 0 0 rgba(228,180,106,0); } 50% { transform:translateY(-4px) scale(1.06); box-shadow:1px 2px 0 rgba(0,0,0,.5), 0 0 0 7px rgba(228,180,106,.22), 0 0 26px rgba(228,180,106,.55); } }
.stock.hint-stock { animation:stockHint 1s ease-in-out 3; }
.card.deal-in { animation:dealIn .24s ease both; }
.rank { position:absolute; top:7px; left:8px; font-size:clamp(15px, 2.1vw, 22px); font-weight:800; line-height:1; }
.suit { position:absolute; top:29px; left:10px; font-size:clamp(15px, 2.2vw, 23px); }
.corner { position:absolute; bottom:5px; right:8px; font-size:17px; transform:rotate(180deg); opacity:.32; }
.card.red { color:var(--red); }
.card.black { color:#273630; }
.card-tail { position:absolute; bottom:8px; left:10px; right:10px; height:4px; border-radius:99px; background:currentColor; opacity:.12; }
.bottom-row { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:18px; flex-wrap:wrap; }
.stock-area { display:flex; align-items:center; gap:12px; }
.stock { width:72px; height:96px; border-radius:11px; background:linear-gradient(135deg, #234e4a, #102e2d); border:1px solid rgba(210,240,220,.25); box-shadow:0 6px 13px rgba(0,0,0,.25); position:relative; cursor:pointer; display:grid; place-items:center; color:#efc98c; font-weight:800; }
.stock::before { content:''; position:absolute; inset:6px; border:1px solid rgba(228,180,106,.44); border-radius:7px; background:repeating-linear-gradient(45deg, rgba(228,180,106,.08) 0 2px, transparent 2px 6px); }
.stock span { position:relative; font-size:20px; }
.stock.empty { opacity:.35; cursor:default; }
.stock-label { color:var(--muted); font-size:12px; }
.tips { color:var(--muted); font-size:12px; text-align:right; max-width:460px; line-height:1.55; }
.footer-note { margin-top:18px; color:var(--muted); font-size:12px; display:flex; gap:9px; align-items:center; }
.footer-dot { width:7px; height:7px; background:var(--accent2); border-radius:50%; box-shadow:0 0 10px var(--accent2); }
.overlay { position:fixed; inset:0; display:none; place-items:center; padding:24px; background:rgba(3,12,12,.65); backdrop-filter:blur(8px); z-index:30; }
.overlay.open { display:grid; }
.modal { width:min(420px,100%); border:1px solid rgba(228,180,106,.36); background:linear-gradient(145deg,#173f3b,#0e2928); border-radius:22px; padding:28px; box-shadow:0 28px 90px rgba(0,0,0,.45); text-align:center; }
.modal .emoji { font-size:42px; }
.modal h2 { margin:12px 0 7px; font-size:25px; }
.modal p { color:var(--muted); line-height:1.7; margin:0 0 20px; }
.modal-actions { display:flex; gap:10px; justify-content:center; }
.toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px); opacity:0; pointer-events:none; background:#e4b46a; color:#162a25; font-weight:750; padding:10px 15px; border-radius:12px; box-shadow:0 10px 26px rgba(0,0,0,.25); transition: all .2s ease; z-index:40; }
.toast.show { opacity:1; transform:translate(-50%,0); }
@media (max-width: 620px) {
  .topbar { padding:14px; }
  .brand p { display:none; }
  .top-actions .ghost { display:none; }
  .shell { padding:16px 10px 24px; }
  .hud { align-items:flex-start; }
  .stats { width:100%; }
  .stat { flex:1; min-width:0; }
  .board-wrap { padding:10px; border-radius:16px; }
  .board { min-width:0; gap:4px; grid-template-columns:repeat(10, minmax(0, 1fr)); }
  .column { min-height:430px; }
  .card { min-height:84px; margin-bottom:-60px; }
  .stock { width:64px; height:86px; }
  .tips { text-align:left; }
}
/* User-supplied classic card face sprite sheet, cropped into 52 original image assets. */
.card { aspect-ratio: 71 / 96; }
.card.face-up { padding:0; overflow:hidden; background:#fff; }
.card-art { position:absolute; inset:0; display:block; width:100%; height:100%; object-fit:fill; border-radius:2px; image-rendering:auto; }
/* Classic Windows inspired card skin: original CSS redraw for this game. */
.card { border-radius:3px; transition: transform .16s ease, box-shadow .16s ease, filter .16s ease; }
.card.face-up { background:#fcfcf8; color:#111; border:1px solid #737373; box-shadow:1px 2px 0 rgba(0,0,0,.45), 0 4px 8px rgba(0,0,0,.16); }
.card.face-up:hover { transform:translateY(-2px); box-shadow:2px 4px 0 rgba(0,0,0,.36), 0 8px 12px rgba(0,0,0,.18); }
.card.face-down { background-color:#12548a; background-image:linear-gradient(45deg, rgba(255,255,255,.18) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.18) 75%), linear-gradient(45deg, rgba(255,255,255,.12) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.12) 75%); background-position:0 0, 5px 5px; background-size:10px 10px; border:1px solid #e7e7e7; box-shadow:1px 2px 0 rgba(0,0,0,.5), inset 0 0 0 2px #0c3a62; }
.card.face-down::before { inset:5px; border:1px solid rgba(255,255,255,.7); border-radius:1px; background:transparent; }
.rank { top:5px; left:7px; font-family:Georgia, 'Times New Roman', serif; font-size:clamp(18px, 2.4vw, 26px); font-weight:700; line-height:1; }
.suit { top:28px; left:8px; font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px, 2.2vw, 24px); line-height:1; }
.corner { bottom:5px; right:7px; font-family:Georgia, 'Times New Roman', serif; font-size:15px; opacity:.22; }
.card-tail { left:8px; right:8px; bottom:7px; height:3px; opacity:.18; }
.card.red { color:#b40000; }
.card.black { color:#111; }
.stock { border-radius:3px; background-color:#12548a; background-image:linear-gradient(45deg, rgba(255,255,255,.18) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.18) 75%), linear-gradient(45deg, rgba(255,255,255,.12) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.12) 75%); background-position:0 0, 5px 5px; background-size:10px 10px; border:1px solid #e7e7e7; box-shadow:1px 2px 0 rgba(0,0,0,.5), inset 0 0 0 2px #0c3a62; }
.stock::before { inset:5px; border:1px solid rgba(255,255,255,.7); border-radius:1px; background:transparent; }
/* Fit the full tableau inside the viewport. */
html, body { height:100%; overflow:hidden; }
.app { height:100dvh; min-height:0; }
.topbar { position:relative; flex:0 0 auto; }
.shell { height:calc(100dvh - 76px); min-height:0; display:flex; flex-direction:column; overflow:hidden; }
.hud { flex:0 0 auto; }
.board-wrap { flex:1 1 auto; min-height:0; overflow:hidden; }
.board { height:100%; min-width:0; min-height:0; padding-bottom:0; grid-template-columns:repeat(10, minmax(0, 1fr)); }
.column { min-width:0; }
.column { min-height:0; }
.card { height:var(--fit-card-height, auto); min-height:0; aspect-ratio:auto; margin-bottom:calc(var(--fit-card-overlap, 0px) * -1); }
.card:last-child { margin-bottom:0; }
.bottom-row, .footer-note { flex:0 0 auto; }
.deal-row { margin-top:0; margin-bottom:10px; }
.card.face-down { height:var(--fit-back-height, 18px); min-height:0; aspect-ratio:auto; margin-bottom:calc(8px - var(--fit-back-height, 18px)); }
.card.face-down:last-child { margin-bottom:0; }
.card.face-up { margin-bottom:calc(38px - var(--fit-card-height, 0px)); }
.card.face-up:last-child { margin-bottom:0; }
@media (max-width: 620px) {
  .shell { height:calc(100dvh - 66px); padding:10px 8px 12px; }
  .hud { gap:8px; margin-bottom:8px; }
  .board-wrap { padding:7px; border-radius:14px; }
  .board { gap:4px; }
  .column { padding:4px 2px 6px; }
  .bottom-row { margin-top:8px; }
  .footer-note { margin-top:8px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">♠</div><div><h1>织网纸牌</h1><p>Spider Solitaire · 清爽桌面版</p></div></div>
    <div class="top-actions"><button class="ghost" id="undoBtn">↶ 撤回</button><button class="ghost" id="hintBtn">✦ 提示</button><button class="ghost" id="soundBtn">♫ 声音</button><button class="primary" id="newBtn">新牌局</button></div>
  </header>
  <main class="shell">
    <section class="hud">
      <div class="mode-tabs" aria-label="难度选择"><button class="mode-tab active" data-mode="1">单花色</button><button class="mode-tab" data-mode="2">双花色</button><button class="mode-tab" data-mode="4">四色挑战</button></div>
      <div class="stats"><div class="stat"><small>时间</small><strong id="time">00:00</strong></div><div class="stat"><small>步数</small><strong id="moves">0</strong></div><div class="stat"><small>已完成</small><strong id="completed">0 / 8</strong></div><div class="stat"><small>牌局</small><strong id="seedLabel">—</strong></div></div>
    </section>
    <section class="bottom-row deal-row">
      <div class="stock-area"><button id="stock" class="stock" aria-label="发牌"><span id="stockCount">5</span></button><div><div class="stock-label">剩余发牌轮数</div><div id="statusText" class="stock-label">选择一组同花色连续牌开始移动</div></div></div>
      <div class="tips">点击一张牌选择整组，点击目标列移动；也可以直接拖拽。</div>
    </section>
    <section class="board-wrap"><div id="board" class="board" aria-label="蜘蛛纸牌牌桌"></div></section>
    <div class="footer-note"><span class="footer-dot"></span><span>本地离线运行 · 每局随机种子可复盘 · 原创桌面与牌背</span></div>
  </main>
</div>
<div id="overlay" class="overlay"><div class="modal"><div class="emoji">✦</div><h2>恭喜完成牌局</h2><p id="winText">你把所有牌组都收进了完成区。</p><div class="modal-actions"><button class="ghost" id="closeModal">查看牌桌</button><button class="primary" id="playAgain">再来一局</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
(() => {
  const SUITS = ['♠','♥','♦','♣'];
  const SUIT_ASSET = {'♣':'clubs','♦':'diamonds','♥':'hearts','♠':'spades'};
  const RED = new Set(['♥','♦']);
  const state = { mode: 1, columns: [], stock: [], completed: 0, moves: 0, history: [], selected: null, seed: 0, startedAt: 0, elapsedBefore: 0, timer: null, hint: null, drag: null, suppressClickUntil: 0, soundEnabled: true, dealFlash: false };
  const $ = (s) => document.querySelector(s);
  const board = $('#board');
  const rankName = (r) => r === 1 ? 'A' : r === 11 ? 'J' : r === 12 ? 'Q' : r === 13 ? 'K' : String(r);
  const cardAsset = (card) => `assets/cards/${SUIT_ASSET[card.suit]}-${rankName(card.rank)}.png`;
  const clone = (v) => JSON.parse(JSON.stringify(v));
  const SAVE_KEY = 'woven-spider-solitaire-v1';
  let audioContext = null;
  function persist() {
    try {
      if (typeof localStorage === 'undefined') return;
      localStorage.setItem(SAVE_KEY, JSON.stringify({ mode: state.mode, columns: state.columns, stock: state.stock, completed: state.completed, moves: state.moves, history: state.history, selected: null, seed: state.seed, elapsedBefore: elapsed(), soundEnabled: state.soundEnabled }));
    } catch (_) {}
  }
  function restoreSavedGame() {
    try {
      if (typeof localStorage === 'undefined') return false;
      const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (!saved || !Array.isArray(saved.columns) || saved.columns.length !== 10 || !Array.isArray(saved.stock)) return false;
      state.mode = [1,2,4].includes(saved.mode) ? saved.mode : 1;
      state.columns = saved.columns; state.stock = saved.stock; state.completed = Number(saved.completed) || 0; state.moves = Number(saved.moves) || 0; state.history = Array.isArray(saved.history) ? saved.history : []; state.selected = null; state.hint = null; state.seed = Number(saved.seed) || 0; state.elapsedBefore = Number(saved.elapsedBefore) || 0; state.startedAt = Date.now(); state.soundEnabled = saved.soundEnabled !== false;
      render(); checkWin(); updateSoundButton(); return true;
    } catch (_) { return false; }
  }
  function ensureAudio() { if (!state.soundEnabled) return null; try { if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)(); if (audioContext.state === 'suspended') audioContext.resume(); return audioContext; } catch (_) { return null; } }
  function playTone(frequency, duration=.08, type='sine', volume=.035) { const ctx = ensureAudio(); if (!ctx) return; const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = type; osc.frequency.value = frequency; gain.gain.setValueAtTime(volume, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + duration); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + duration); }
  let bgmAudio = null;
  function startBgm() {
    if (!state.soundEnabled || typeof Audio === 'undefined') return;
    try {
      if (!bgmAudio) { bgmAudio = new Audio('assets/sounds/bgm.mp3'); bgmAudio.loop = true; bgmAudio.preload = 'auto'; bgmAudio.volume = .22; }
      const result = bgmAudio.play(); if (result && typeof result.catch === 'function') result.catch(() => {});
    } catch (_) {}
  }
  function stopBgm() { if (bgmAudio) { bgmAudio.pause(); bgmAudio.currentTime = 0; } }
  let flipAudioTemplate = null;
  function playFlipSound() {
    if (!state.soundEnabled || typeof Audio === 'undefined') return;
    try {
      if (!flipAudioTemplate) { flipAudioTemplate = new Audio('assets/sounds/card-flip.mp3'); flipAudioTemplate.preload = 'auto'; }
      const audio = flipAudioTemplate.cloneNode(); audio.volume = .72; audio.currentTime = 0;
      const result = audio.play(); if (result && typeof result.catch === 'function') result.catch(() => {});
    } catch (_) {}
  }
  function playMoveSound() { playFlipSound(); }
  function playDealSound() { playTone(280, .08, 'triangle', .03); setTimeout(() => playTone(360, .08, 'triangle', .022), 55); }
  function playWinSound() { [523, 659, 784].forEach((f, i) => setTimeout(() => playTone(f, .16, 'sine', .035), i * 90)); }
  function updateSoundButton() { const btn = $('#soundBtn'); if (btn) { btn.textContent = state.soundEnabled ? '♫ 声音' : '♩ 静音'; btn.setAttribute('aria-pressed', String(state.soundEnabled)); } }
  function rng(seed) { let t = seed >>> 0; return () => { t += 0x6D2B79F5; let x = t; x = Math.imul(x ^ x >>> 15, x | 1); x ^= x + Math.imul(x ^ x >>> 7, x | 61); return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
  function makeSeed() { return Math.floor(Math.random() * 0xFFFFFFFF); }
  function fmtTime(sec) { sec = Math.max(0, Math.floor(sec)); return String(Math.floor(sec / 60)).padStart(2,'0') + ':' + String(sec % 60).padStart(2,'0'); }
  function elapsed() { return state.elapsedBefore + (state.startedAt ? (Date.now() - state.startedAt) / 1000 : 0); }
  function saveSnapshot() { state.history.push({ columns: clone(state.columns), stock: clone(state.stock), completed: state.completed, moves: state.moves, elapsedBefore: elapsed() }); if (state.history.length > 100) state.history.shift(); }
  function restoreSnapshot(s) { state.columns = clone(s.columns); state.stock = clone(s.stock); state.completed = s.completed; state.moves = s.moves; state.elapsedBefore = s.elapsedBefore; state.startedAt = Date.now(); state.selected = null; state.hint = null; render(); persist(); }
  function makeDeck(mode, seed) {
    const suits = mode === 1 ? [SUITS[0]] : mode === 2 ? [SUITS[0], SUITS[1]] : SUITS;
